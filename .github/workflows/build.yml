name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Package as io808.zip
        run: |
          mkdir -p dist
          cp -r out dist/io808
          cd dist && zip -qr ../io808.zip io808

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest io808.zip \
            --title "Latest build" \
            --notes "Built automatically from ${GITHUB_SHA::7}. Unzip in the site root to get the io808/ folder." \
            --target "$GITHUB_SHA"

